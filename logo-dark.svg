<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1abc9c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8edf5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c8d4e8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Mask icon: two halves of a face with eye cutouts -->
  <!-- Left half of mask -->
  <path d="M14,8 C14,8 6,10 6,22 C6,30 10,38 14,44 C14,44 10,36 8,28 C6,20 8,14 14,8Z"
        fill="#e8edf5" opacity="0.95"/>
  <!-- Left eye cutout -->
  <path d="M10,18 C10,18 12,17 14,18 C16,19 16,21 14,22 C12,21 10,20 10,18Z"
        fill="#111419"/>
  <!-- Right half of mask -->
  <path d="M18,8 C18,8 26,10 26,22 C26,30 22,38 18,44 C18,44 22,36 24,28 C26,20 24,14 18,8Z"
        fill="#e8edf5" opacity="0.95"/>
  <!-- Right eye cutout -->
  <path d="M20,18 C20,18 22,17 24,18 C26,19 26,21 24,22 C22,21 20,20 20,18Z"
        fill="#111419"/>
  <!-- Bridge between halves -->
  <path d="M14,8 C14,12 16,12 18,8 L18,4 C18,4 16,6 14,6Z"
        fill="#e8edf5" opacity="0.95"/>
  <!-- Top curve / head outline -->
  <path d="M10,8 C12,4 20,4 22,8"
        fill="none" stroke="#e8edf5" stroke-width="1.5" stroke-linecap="round"/>

  <!-- "no" in bright green -->
  <text x="12" y="80" font-family="'Arial Rounded MT Bold', 'Nunito Sans', Arial, sans-serif"
        font-size="58" font-weight="900" fill="url(#greenGrad)">no</text>

  <!-- "naym" in bright blue/white -->
  <text x="82" y="80" font-family="'Arial Rounded MT Bold', 'Nunito Sans', Arial, sans-serif"
        font-size="58" font-weight="900" fill="url(#whiteGrad)">naym</text>
</svg>
