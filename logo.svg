<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2ecc71;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1abc9c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a2a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a3a6a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield icon (small, above text) -->
  <path d="M16,10 L30,18 L30,33 C30,42 23,49 16,53 C9,49 2,42 2,33 L2,18 Z"
        fill="none" stroke="#1a3a6a" stroke-width="1.5"/>

  <!-- "no" in green -->
  <text x="12" y="80" font-family="'Arial Rounded MT Bold', 'Nunito Sans', Arial, sans-serif"
        font-size="58" font-weight="700" fill="url(#greenGrad)">no</text>

  <!-- "naym" in dark navy -->
  <text x="82" y="80" font-family="'Arial Rounded MT Bold', 'Nunito Sans', Arial, sans-serif"
        font-size="58" font-weight="700" fill="url(#navyGrad)">naym</text>
</svg>
